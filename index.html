<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theory Tester — Offline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M20 33l8 8 16-18' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1b2430; --muted:#5d6b7e; --line:#e3e8f0;
    --brand:#2563eb; --brand-ink:#ffffff; --brand-soft:#eaf1ff;
    --good:#12915b; --good-soft:#e5f6ec; --bad:#d23b3b; --bad-soft:#fdeaea;
    --warn:#c2830a; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f141b; --card:#161d27; --ink:#e8edf4; --muted:#9aa7b8; --line:#28323f;
      --brand:#4f86ff; --brand-soft:#1a2740; --brand-ink:#ffffff;
      --good:#3ac07f; --good-soft:#12281d; --bad:#f0685f; --bad-soft:#2c1717;
      --warn:#e0b13c; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{ --bg:#f4f6fb;--card:#fff;--ink:#1b2430;--muted:#5d6b7e;--line:#e3e8f0;--brand:#2563eb;--brand-soft:#eaf1ff;--good:#12915b;--good-soft:#e5f6ec;--bad:#d23b3b;--bad-soft:#fdeaea;--warn:#c2830a; }
  :root[data-theme="dark"]{ --bg:#0f141b;--card:#161d27;--ink:#e8edf4;--muted:#9aa7b8;--line:#28323f;--brand:#4f86ff;--brand-soft:#1a2740;--good:#3ac07f;--good-soft:#12281d;--bad:#f0685f;--bad-soft:#2c1717;--warn:#e0b13c; }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--brand)}
  .wrap{max-width:820px; margin:0 auto; padding:0 16px 64px}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%, transparent);
    backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
  .brand{font-weight:800;letter-spacing:-.02em;cursor:pointer;font-size:18px}
  .brand span{color:var(--brand)}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
    padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .iconbtn:hover{border-color:var(--brand)}

  /* Timer / test header */
  .exambar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;padding:6px 12px;border-radius:10px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
  .timer.low{color:var(--bad);border-color:var(--bad)}
  .pill{font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);
    padding:6px 12px;border-radius:999px}

  /* Progress grid */
  .grid{display:grid;grid-template-columns:repeat(20,1fr);gap:5px;margin:6px 0 18px}
  @media (max-width:560px){.grid{grid-template-columns:repeat(10,1fr)}}
  .cell{aspect-ratio:1/1;border-radius:6px;border:1px solid var(--line);background:var(--card);
    font-size:11px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .cell.answered{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
  .cell.current{outline:2px solid var(--brand);outline-offset:1px}
  .cell.flag{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
  .cell.correct{background:var(--good-soft);border-color:var(--good);color:var(--good)}
  .cell.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;margin:14px 0}
  .badge{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);
    padding:4px 10px;border-radius:999px;margin-bottom:10px}
  .qtext{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:2px 0 14px}
  .qimg{display:block;max-width:100%;height:auto;border-radius:10px;margin:12px auto 16px;border:1px solid var(--line);object-fit:contain;background:#fff;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .qimg.small{max-width:280px;max-height:220px}

  /* Options */
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:12px;
    padding:13px 15px;cursor:pointer;background:var(--card);transition:border-color .12s,background .12s;text-align:left;width:100%;font:inherit;color:inherit}
  .opt:hover{border-color:var(--brand)}
  .opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted)}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .opt.sel .key{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .opt.correct{border-color:var(--good);background:var(--good-soft)}
  .opt.correct .key{background:var(--good);border-color:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.disabled{cursor:default}
  .opt.disabled:hover{border-color:var(--line)}
  .opt.disabled.correct:hover{border-color:var(--good)}
  .opt.disabled.wrong:hover{border-color:var(--bad)}
  .opt .txt{padding-top:2px}

  .explain{margin-top:14px;padding:13px 15px;border-radius:12px;background:var(--brand-soft);
    border:1px solid var(--line);font-size:14.5px}
  .explain b{display:block;margin-bottom:4px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}

  /* Buttons */
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .btn{border:none;border-radius:11px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;
    background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn:hover{border-color:var(--brand)}
  .btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.big{padding:15px 22px;font-size:16px}
  .grow{flex:1}

  /* Home */
  .hero{text-align:center;padding:34px 0 8px}
  .hero h1{font-size:32px;letter-spacing:-.03em;margin:0 0 8px}
  .hero p{color:var(--muted);margin:0 auto;max-width:560px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  @media (max-width:560px){.tiles{grid-template-columns:1fr}}
  .tile{text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;display:block;width:100%}
  .tile h3{margin:0 0 6px;font-size:18px}
  .tile p{margin:0;color:var(--muted);font-size:14px}
  .tile .em{font-size:26px}
  .hardest-cta{display:flex;align-items:center;gap:16px;width:100%;text-align:left;margin-top:14px;cursor:pointer;
    color:var(--ink);font-family:inherit;border-color:var(--bad);
    background:linear-gradient(90deg,var(--bad-soft),var(--card) 60%)}
  .hardest-cta:hover{filter:brightness(1.02);border-color:var(--bad)}
  .hardest-cta .em{font-size:30px;flex:0 0 auto}
  .hardest-cta .hc-text{display:flex;flex-direction:column;gap:2px;flex:1}
  .hardest-cta .hc-text b{font-size:17px}
  .hardest-cta .hc-text span{color:var(--muted);font-size:14px}
  .hardest-cta .hc-go{color:var(--bad);font-weight:700;font-size:14px;flex:0 0 auto}
  .catlist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .catrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    background:var(--card);cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
  .catrow:hover{border-color:var(--brand)}
  .catrow .n{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
  .stat{font-size:13px;color:var(--muted)}

  /* Result */
  .result-banner{text-align:center;padding:26px}
  .result-banner .big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .result-banner.pass{background:var(--good-soft);border-color:var(--good)}
  .result-banner.fail{background:var(--bad-soft);border-color:var(--bad)}
  .result-banner.pass .verdict{color:var(--good)}
  .result-banner.fail .verdict{color:var(--bad)}
  .verdict{font-size:26px;font-weight:800;margin-top:6px}
  .metaline{color:var(--muted);margin-top:8px;font-size:15px}

  .filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:none;background:var(--card);color:var(--muted);padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--brand);color:var(--brand-ink)}
  input.search{flex:1;min-width:180px;padding:11px 14px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:15px}
  input.search::placeholder{color:var(--muted)}

  .rev-item{border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0;background:var(--card)}
  .rev-q{font-weight:700;margin-bottom:8px}
  .rev-opt{padding:8px 12px;border-radius:9px;margin:5px 0;border:1px solid var(--line);font-size:14.5px}
  .rev-opt.correct{background:var(--good-soft);border-color:var(--good)}
  .rev-opt.yours{background:var(--bad-soft);border-color:var(--bad)}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-left:8px}
  .tag.c{color:var(--good)} .tag.y{color:var(--bad)}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .hide{display:none!important}
  .footnote{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px}
  kbd{font:inherit;font-size:12px;background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
  @media (max-width:560px){.qimg{max-width:100%!important;max-height:180px;margin:10px auto 14px;padding:4px}.qimg.small{max-width:220px!important}.card{padding:16px}.qtext{font-size:17px;line-height:1.35}.opt{padding:11px 13px;font-size:14px}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand" id="brand">Theory<span>Tester</span> · offline</div>
      <div class="spacer"></div>
      <button class="iconbtn" id="themeBtn" title="Toggle theme">◐ Theme</button>
    </div>
  </div>
  <div class="wrap" id="app"></div>

  <script src="questions.js"></script>
  <script>
  "use strict";
  (function(){
    const QUESTIONS = window.QUESTIONS || [];
    const CATEGORIES = window.CATEGORIES || {};
    const HARDEST = window.HARDEST || [];
    const QBYID = new Map(QUESTIONS.map(q=>[q.id,q]));
    const byId = (id)=> QBYID.get(id);
    const HARD_BY_ID = new Map(HARDEST.map(h=>[h.id,h]));
    const TEST_LEN = 40;
    const TEST_SECONDS = 40 * 60;
    const PASS_MARK = 35;
    const app = document.getElementById('app');

    /* ---------- helpers ---------- */
    const esc = (s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const KEYS = ['A','B','C','D','E','F'];
    const optIndex = (a)=> parseInt(String(a).replace('option_',''),10)-1;
    const correctIdx = (q)=> optIndex(q.answer[0]);
    const imgTag = (q,cls)=> q.img ? `<img class="qimg ${cls||''}" src="img/${esc(q.img)}" alt="Question image" loading="lazy">` : '';
    const fmtTime = (s)=>{ s=Math.max(0,s|0); const m=(s/60)|0, r=s%60; return m+':' + String(r).padStart(2,'0'); };
    const catName = (id)=> CATEGORIES[id] || ('Category '+id);
    function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    function sample(arr,n){ return shuffle(arr).slice(0,n); }
    const store = {
      get(k,d){ try{ const v=localStorage.getItem('tt_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
      set(k,v){ try{ localStorage.setItem('tt_'+k, JSON.stringify(v)); }catch(e){} }
    };

    /* ---------- theme ---------- */
    function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
    applyTheme(store.get('theme',null));
    document.getElementById('themeBtn').onclick=()=>{
      const cur = document.documentElement.getAttribute('data-theme');
      const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      const next = isDark ? 'light':'dark'; applyTheme(next); store.set('theme',next);
    };
    document.getElementById('brand').onclick=()=>{ stopTimer(); renderHome(); };

    /* ================= HOME ================= */
    function renderHome(){
      const best = store.get('best',null);
      const catCounts = {};
      QUESTIONS.forEach(q=> catCounts[q.category_id]=(catCounts[q.category_id]||0)+1);
      const cats = Object.keys(catCounts).sort();
      app.innerHTML = `
        <div class="hero">
          <h1>Irish Driver Theory Test</h1>
          <p>Practice offline with the full bank of <b>${QUESTIONS.length}</b> questions. No internet needed.</p>
        </div>
        <div class="tiles">
          <button class="card tile" id="tMock">
            <div class="em">📝</div>
            <h3>Mock Test</h3>
            <p>${TEST_LEN} random questions · ${TEST_SECONDS/60}-minute timer · pass mark ${PASS_MARK}/${TEST_LEN}.</p>
            ${best?`<p class="stat" style="margin-top:8px">Best: <b>${best.score}/${TEST_LEN}</b> (${best.pct}%)</p>`:''}
          </button>
          <button class="card tile" id="tPractice">
            <div class="em">🎯</div>
            <h3>Practice</h3>
            <p>Answer questions with instant feedback and explanations. Choose a category or go through all.</p>
          </button>
          <button class="card tile" id="tRevise">
            <div class="em">📖</div>
            <h3>Revise Questions</h3>
            <p>Browse and search every question with the correct answer and explanation shown.</p>
          </button>
          <button class="card tile" id="tCat">
            <div class="em">🗂️</div>
            <h3>Practice by Category</h3>
            <p>Focus on one topic at a time.</p>
          </button>
        </div>
        ${HARDEST.length?`<button class="card hardest-cta" id="tHardest">
            <span class="em">🔥</span>
            <span class="hc-text"><b>The ${HARDEST.length} Hardest Questions</b>
            <span>The questions people get wrong most often — study these to boost your score.</span></span>
            <span class="hc-go">Open →</span>
          </button>`:''}
        <div class="footnote">Fully offline copy · questions &amp; images cached locally · built for study, not affiliated with theory-tester.com</div>
      `;
      document.getElementById('tMock').onclick=()=>startMock();
      document.getElementById('tPractice').onclick=()=>startPractice(null);
      document.getElementById('tRevise').onclick=()=>renderRevise();
      document.getElementById('tCat').onclick=()=>renderCategoryPicker(catCounts,cats);
      const hb=document.getElementById('tHardest'); if(hb) hb.onclick=()=>renderHardest();
    }

    function renderCategoryPicker(counts,cats){
      app.innerHTML = `<div class="card"><h2 style="margin-top:4px">Practice by Category</h2>
        <div class="catlist">
          ${cats.map(c=>`<button class="catrow" data-c="${c}"><span>${esc(catName(c))}</span><span class="n">${counts[c]} questions</span></button>`).join('')}
        </div>
        <div class="row"><button class="btn ghost" id="back">← Back</button></div></div>`;
      app.querySelectorAll('.catrow').forEach(b=> b.onclick=()=>startPractice(b.dataset.c));
      document.getElementById('back').onclick=renderHome;
    }

    /* ================= MOCK TEST ================= */
    let T = null;        // test state
    let timerId = null;
    function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

    function startMock(){
      T = {
        qs: sample(QUESTIONS, TEST_LEN),
        answers: new Array(TEST_LEN).fill(null),
        flags: new Array(TEST_LEN).fill(false),
        cur: 0, remaining: TEST_SECONDS, paused:false, submitted:false, startedAt:Date.now()
      };
      stopTimer();
      timerId = setInterval(()=>{
        if(T.paused||T.submitted) return;
        T.remaining--;
        updateTimer();
        if(T.remaining<=0){ stopTimer(); submitMock(true); }
      },1000);
      renderMock();
    }

    function updateTimer(){
      const el=document.getElementById('timer'); if(!el) return;
      el.textContent = fmtTime(T.remaining);
      el.classList.toggle('low', T.remaining<=120);
    }

    function renderMock(){
      const i=T.cur, q=T.qs[i];
      const answered = T.answers.filter(a=>a!==null).length;
      app.innerHTML = `
        <div class="exambar">
          <div class="timer" id="timer">${fmtTime(T.remaining)}</div>
          <span class="pill">Question ${i+1} / ${TEST_LEN}</span>
          <span class="pill">${answered} answered</span>
          <div class="spacer" style="flex:1"></div>
          <button class="btn ghost" id="pauseBtn">${T.paused?'▶ Resume':'⏸ Pause'}</button>
          <button class="btn ghost" id="quitBtn">Quit</button>
        </div>
        <div class="grid" id="grid">${T.qs.map((_,k)=>{
          let cls='cell'; if(T.answers[k]!==null) cls+=' answered'; if(k===i) cls+=' current'; if(T.flags[k]) cls+=' flag';
          return `<button class="${cls}" data-k="${k}">${k+1}</button>`;
        }).join('')}</div>
        <div id="qarea"></div>`;
      if(T.paused){
        document.getElementById('qarea').innerHTML = `<div class="card center"><div class="em" style="font-size:34px">⏸</div>
          <h2>Test paused</h2><p class="muted">The timer is stopped. Resume when you're ready.</p>
          <div class="row" style="justify-content:center"><button class="btn primary" id="resume2">▶ Resume test</button></div></div>`;
        document.getElementById('resume2').onclick=togglePause;
      } else {
        renderMockQuestion(q,i);
      }
      document.getElementById('pauseBtn').onclick=togglePause;
      document.getElementById('quitBtn').onclick=()=>{ if(confirm('Quit this test? Your progress will be lost.')){ stopTimer(); renderHome(); } };
      document.getElementById('grid').querySelectorAll('.cell').forEach(c=> c.onclick=()=>{ T.cur=+c.dataset.k; renderMock(); });
    }

    function renderMockQuestion(q,i){
      document.getElementById('qarea').innerHTML = `
        <div class="card">
          <span class="badge">${esc(catName(q.category_id))}</span>
          <div class="qtext">${esc(q.question)}</div>
          ${imgTag(q,'small')}
          <div class="opts">
            ${q.options.map((o,idx)=>`<button class="opt ${T.answers[i]===idx?'sel':''}" data-idx="${idx}">
              <span class="key">${KEYS[idx]}</span><span class="txt">${esc(o)}</span></button>`).join('')}
          </div>
          <div class="row">
            <button class="btn ghost" id="flagBtn">${T.flags[i]?'★ Flagged':'☆ Flag for review'}</button>
            <div class="grow"></div>
            <button class="btn" id="prevBtn" ${i===0?'disabled':''}>← Previous</button>
            ${i===TEST_LEN-1
              ? `<button class="btn primary" id="finishBtn">Finish test</button>`
              : `<button class="btn primary" id="nextBtn">Next →</button>`}
          </div>
        </div>`;
      document.querySelectorAll('.opt').forEach(b=> b.onclick=()=>{ T.answers[i]=+b.dataset.idx; renderMock(); });
      document.getElementById('flagBtn').onclick=()=>{ T.flags[i]=!T.flags[i]; renderMock(); };
      const prev=document.getElementById('prevBtn'); if(prev) prev.onclick=()=>{ T.cur=Math.max(0,i-1); renderMock(); };
      const next=document.getElementById('nextBtn'); if(next) next.onclick=()=>{ T.cur=Math.min(TEST_LEN-1,i+1); renderMock(); };
      const fin=document.getElementById('finishBtn'); if(fin) fin.onclick=()=> confirmFinish();
    }

    function togglePause(){ T.paused=!T.paused; renderMock(); }

    function confirmFinish(){
      const unanswered = T.answers.filter(a=>a===null).length;
      const msg = unanswered>0 ? `You have ${unanswered} unanswered question(s). Submit anyway?` : 'Submit your test for marking?';
      if(confirm(msg)) submitMock(false);
    }

    function submitMock(timeUp){
      T.submitted=true; stopTimer();
      let score=0;
      T.qs.forEach((q,i)=>{ if(T.answers[i]===correctIdx(q)) score++; });
      const pct=Math.round(score/TEST_LEN*100);
      const pass=score>=PASS_MARK;
      const best=store.get('best',null);
      if(!best || score>best.score) store.set('best',{score,pct});
      renderResult({score,pct,pass,timeUp});
    }

    /* ================= RESULT ================= */
    function renderResult(r){
      const timeTaken = TEST_SECONDS - T.remaining;
      let filter='all';
      const draw=()=>{
        const items = T.qs.map((q,i)=>({q,i,your:T.answers[i],ok:T.answers[i]===correctIdx(q)}))
                        .filter(x=> filter==='all' ? true : filter==='wrong' ? !x.ok : x.ok);
        return items.map(({q,i,your,ok})=>`
          <div class="rev-item">
            <div class="rev-q">${i+1}. ${esc(q.question)} ${ok?'<span class="tag c">✓ correct</span>':'<span class="tag y">✗ incorrect</span>'}</div>
            ${imgTag(q,'small')}
            ${q.options.map((o,idx)=>{
              const isC=idx===correctIdx(q), isY=idx===your;
              let cls='rev-opt'; if(isC) cls+=' correct'; else if(isY) cls+=' yours';
              let tag = isC?'<span class="tag c">correct answer</span>' : (isY?'<span class="tag y">your answer</span>':'');
              return `<div class="${cls}">${KEYS[idx]}. ${esc(o)} ${tag}</div>`;
            }).join('')}
            ${q.explanation?`<div class="explain"><b>Explanation</b>${esc(q.explanation)}</div>`:''}
          </div>`).join('');
      };
      app.innerHTML = `
        <div class="card result-banner ${r.pass?'pass':'fail'}">
          ${r.timeUp?`<div class="badge" style="color:var(--warn);background:transparent;border:1px solid var(--warn)">⏱ Time's up</div>`:''}
          <div class="verdict">${r.pass?'PASS ✓':'FAIL ✗'}</div>
          <div class="big">${r.score}<span style="font-size:26px;color:var(--muted)"> / ${TEST_LEN}</span></div>
          <div class="metaline">${r.pct}%  ·  pass mark ${PASS_MARK}/${TEST_LEN}  ·  time taken ${fmtTime(timeTaken)}</div>
        </div>
        <div class="row">
          <button class="btn primary big grow" id="again">Take another test</button>
          <button class="btn big" id="home">Home</button>
        </div>
        <div class="filterbar">
          <b>Review</b>
          <div class="seg" id="seg">
            <button data-f="all" class="on">All</button>
            <button data-f="wrong">Incorrect</button>
            <button data-f="right">Correct</button>
          </div>
        </div>
        <div id="reviewList">${draw()}</div>`;
      document.getElementById('again').onclick=()=>startMock();
      document.getElementById('home').onclick=renderHome;
      app.querySelectorAll('#seg button').forEach(b=> b.onclick=()=>{
        filter=b.dataset.f;
        app.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
        document.getElementById('reviewList').innerHTML=draw();
      });
      window.scrollTo(0,0);
    }

    /* ================= PRACTICE (instant feedback) ================= */
    let P=null;
    function startPractice(catId){
      const pool = catId ? QUESTIONS.filter(q=>q.category_id===catId) : QUESTIONS;
      startPracticePool(pool, catId ? catName(catId) : 'All questions', ()=>startPractice(catId));
    }
    function startPracticePool(pool, label, restart){
      P={ order:shuffle(pool), pos:0, revealed:false, sel:null, right:0, done:0, label, restart };
      renderPractice();
    }
    function renderPractice(){
      const q=P.order[P.pos];
      app.innerHTML=`
        <div class="exambar">
          <span class="pill">${esc(P.label)}</span>
          <span class="pill">Question ${P.pos+1} / ${P.order.length}</span>
          <span class="pill">Score ${P.right}/${P.done}</span>
          <div class="spacer" style="flex:1"></div>
          <button class="btn ghost" id="homeBtn">Home</button>
        </div>
        <div class="card">
          <span class="badge">${esc(catName(q.category_id))}</span>
          ${HARD_BY_ID.has(q.id)?`<span class="badge" style="background:var(--bad-soft);color:var(--bad);margin-left:6px">🔥 Only ${HARD_BY_ID.get(q.id).pct}% get this right</span>`:''}
          <div class="qtext">${esc(q.question)}</div>
          ${imgTag(q,'small')}
          <div class="opts" id="opts">
            ${q.options.map((o,idx)=>`<button class="opt" data-idx="${idx}"><span class="key">${KEYS[idx]}</span><span class="txt">${esc(o)}</span></button>`).join('')}
          </div>
          <div id="fb"></div>
          <div class="row">
            <div class="grow"></div>
            <button class="btn primary" id="nextBtn" ${P.revealed?'':'disabled'}>${P.pos===P.order.length-1?'Finish':'Next question →'}</button>
          </div>
        </div>`;
      document.getElementById('homeBtn').onclick=renderHome;
      const opts=document.getElementById('opts');
      opts.querySelectorAll('.opt').forEach(b=> b.onclick=()=>{ if(P.revealed) return; reveal(+b.dataset.idx); });
      document.getElementById('nextBtn').onclick=()=>{
        if(P.pos===P.order.length-1){ renderPracticeDone(); return; }
        P.pos++; P.revealed=false; P.sel=null; renderPractice(); window.scrollTo(0,0);
      };
    }
    function reveal(idx){
      const q=P.order[P.pos], ci=correctIdx(q); P.revealed=true; P.sel=idx; P.done++;
      const ok=idx===ci; if(ok) P.right++;
      const opts=document.getElementById('opts');
      opts.querySelectorAll('.opt').forEach(b=>{
        const k=+b.dataset.idx; b.classList.add('disabled');
        if(k===ci) b.classList.add('correct');
        else if(k===idx) b.classList.add('wrong');
      });
      document.getElementById('fb').innerHTML =
        `<div class="explain"><b>${ok?'✓ Correct':'✗ Incorrect — correct answer: '+KEYS[ci]}</b>${esc(q.explanation||'')}</div>`;
      // update the running score pill
      const pills=document.querySelectorAll('.pill'); if(pills[2]) pills[2].textContent=`Score ${P.right}/${P.done}`;
      document.getElementById('nextBtn').disabled=false;
    }
    function renderPracticeDone(){
      const pct=P.done?Math.round(P.right/P.done*100):0;
      app.innerHTML=`<div class="card result-banner ${pct>=87?'pass':''}">
        <div class="verdict">Practice complete</div>
        <div class="big">${P.right}<span style="font-size:26px;color:var(--muted)"> / ${P.done}</span></div>
        <div class="metaline">${pct}% correct</div></div>
        <div class="row"><button class="btn primary big grow" id="again">Practice again</button>
        <button class="btn big" id="home">Home</button></div>`;
      document.getElementById('again').onclick=()=>P.restart();
      document.getElementById('home').onclick=renderHome;
    }

    /* ================= HARDEST 50 ================= */
    function hardestList(){
      return HARDEST.slice().sort((a,b)=>a.rank-b.rank)
        .map(h=>({h, q:byId(h.id)})).filter(x=>x.q);
    }
    function renderHardest(){
      const list=hardestList();
      app.innerHTML=`
        <div class="card">
          <h2 style="margin-top:4px">🔥 The ${list.length} Hardest Questions</h2>
          <p class="muted">Ranked hardest first — based on how often people answer each one correctly on theory-tester.com.</p>
          <div class="row">
            <button class="btn primary" id="practiceHard">🎯 Practice these ${list.length}</button>
            <button class="btn ghost" id="back">← Home</button>
          </div>
        </div>
        <div id="list">${list.map(({h,q})=>{
          const ci=correctIdx(q);
          return `<div class="rev-item">
            <div class="rev-q">
              <span class="badge" style="margin-right:8px">#${h.rank}</span>
              <span class="badge" style="background:var(--bad-soft);color:var(--bad);margin-right:8px">${h.pct}% correct</span>
              ${esc(q.question)}</div>
            ${imgTag(q,'small')}
            ${q.options.map((o,idx)=>`<div class="rev-opt ${idx===ci?'correct':''}">${KEYS[idx]}. ${esc(o)} ${idx===ci?'<span class="tag c">correct</span>':''}</div>`).join('')}
            ${q.explanation?`<div class="explain"><b>Explanation</b>${esc(q.explanation)}</div>`:''}
          </div>`;
        }).join('')}</div>`;
      document.getElementById('back').onclick=renderHome;
      document.getElementById('practiceHard').onclick=()=>{
        const pool=list.map(x=>x.q);
        const restart=()=> startPracticePool(pool, '🔥 Hardest '+list.length, restart);
        restart();
      };
      window.scrollTo(0,0);
    }

    /* ================= REVISE (browse + search) ================= */
    function renderRevise(){
      let query='', cat='', limit=40;
      app.innerHTML=`
        <div class="card">
          <h2 style="margin-top:4px">Revise Questions</h2>
          <div class="filterbar">
            <input class="search" id="q" placeholder="Search questions or answers…">
          </div>
          <div class="filterbar">
            <div class="seg" id="catseg">
              <button data-c="" class="on">All</button>
              ${Object.keys(CATEGORIES).sort().map(c=>`<button data-c="${c}">${esc(catName(c))}</button>`).join('')}
            </div>
          </div>
          <div class="stat" id="count"></div>
        </div>
        <div id="list"></div>
        <div class="center" style="margin-top:14px"><button class="btn" id="more">Show more</button></div>`;
      const listEl=document.getElementById('list'), countEl=document.getElementById('count'), moreBtn=document.getElementById('more');
      function matches(){
        const s=query.trim().toLowerCase();
        return QUESTIONS.filter(q=>{
          if(cat && q.category_id!==cat) return false;
          if(!s) return true;
          return q.question.toLowerCase().includes(s)
            || (q.explanation||'').toLowerCase().includes(s)
            || q.options.some(o=>o.toLowerCase().includes(s));
        });
      }
      function draw(){
        const res=matches();
        countEl.textContent=`${res.length} question${res.length===1?'':'s'}`;
        const show=res.slice(0,limit);
        listEl.innerHTML=show.map(q=>{
          const ci=correctIdx(q);
          return `<div class="rev-item">
            <div class="rev-q"><span class="badge" style="margin:0 8px 0 0">${esc(catName(q.category_id))}</span>${esc(q.question)}</div>
            ${imgTag(q,'small')}
            ${q.options.map((o,idx)=>`<div class="rev-opt ${idx===ci?'correct':''}">${KEYS[idx]}. ${esc(o)} ${idx===ci?'<span class="tag c">correct</span>':''}</div>`).join('')}
            ${q.explanation?`<div class="explain"><b>Explanation</b>${esc(q.explanation)}</div>`:''}
          </div>`;
        }).join('') || `<div class="card muted center">No questions match “${esc(query)}”.</div>`;
        moreBtn.style.display = res.length>limit ? '' : 'none';
      }
      document.getElementById('q').oninput=(e)=>{ query=e.target.value; limit=40; draw(); };
      app.querySelectorAll('#catseg button').forEach(b=> b.onclick=()=>{
        cat=b.dataset.c; limit=40;
        app.querySelectorAll('#catseg button').forEach(x=>x.classList.toggle('on',x===b));
        draw();
      });
      moreBtn.onclick=()=>{ limit+=40; draw(); };
      draw();
    }

    /* ---------- boot ---------- */
    if(!QUESTIONS.length){
      app.innerHTML='<div class="card center"><h2>No question data found</h2><p class="muted">questions.js failed to load.</p></div>';
    } else {
      renderHome();
    }
  })();
  </script>
</body>
</html>
